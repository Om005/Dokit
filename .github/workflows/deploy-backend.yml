name: Deploy Backend to EC2

on:
  push:
    branches:
      - main
    paths:
      - 'server/**'

env:
  DEPLOY_DIR:   /home/ubuntu/Dokit/deployments
  CURRENT_LINK: /home/ubuntu/Dokit/current
  STABLE_FILE:  /home/ubuntu/Dokit/.stable_versions
  ENV_FILE:     /home/ubuntu/env/Dokit/.env.production
  APP_NAME:     dokit-backend
  MAX_STABLE:   3
  HEALTH_CHECK_URL:      http://localhost:4000/health
  HEALTH_CHECK_RETRIES:  12
  HEALTH_CHECK_INTERVAL: 5

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set release ID
        id: release
        run: |
          RELEASE_ID="$(date -u '+%Y%m%d-%H%M%S')-${GITHUB_SHA::7}"
          echo "id=$RELEASE_ID" >> "$GITHUB_OUTPUT"
          echo "Release ID: $RELEASE_ID"

      - name: Deploy via SSH
        uses: appleboy/ssh-action@master
        env:
          RELEASE_ID: ${{ steps.release.outputs.id }}
          GH_REPO:    ${{ github.repository }}
          GH_SHA:     ${{ github.sha }}
        with:
          host:     ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key:      ${{ secrets.EC2_SSH_KEY }}
          envs:     RELEASE_ID,GH_REPO,GH_SHA
          command_timeout: 20m
          script: |
            set -euo pipefail

            DEPLOY_DIR="${{ env.DEPLOY_DIR }}"
            CURRENT_LINK="${{ env.CURRENT_LINK }}"
            STABLE_FILE="${{ env.STABLE_FILE }}"
            ENV_FILE="${{ env.ENV_FILE }}"
            APP_NAME="${{ env.APP_NAME }}"
            RELEASE_DIR="$DEPLOY_DIR/$RELEASE_ID"

            PM2_ENTRY="$CURRENT_LINK/server/dist/index.js"

            export PATH="$PATH:/home/ubuntu/.nvm/versions/node/v24.15.0/bin"

            get_stable_list() {
              if [[ -f "$STABLE_FILE" ]]; then
                grep -v '^\s*$' "$STABLE_FILE" || true
              fi
            }

            write_stable_list() {
              local entries=("$@")
              printf '%s\n' "${entries[@]}" > "$STABLE_FILE"
            }

            health_check() {
              local retries=${{ env.HEALTH_CHECK_RETRIES }}
              local interval=${{ env.HEALTH_CHECK_INTERVAL }}
              local url="${{ env.HEALTH_CHECK_URL }}"
              echo "Running health check → $url"
              for i in $(seq 1 "$retries"); do
                if curl -sf --max-time 5 "$url" > /dev/null 2>&1; then
                  echo "Health check passed on attempt $i"
                  return 0
                fi
                echo "  attempt $i/$retries failed, waiting ${interval}s..."
                sleep "$interval"
              done
              echo "Health check FAILED after $retries attempts"
              return 1
            }

            activate_release() {
              local dir="$1"
              echo "Activating release: $dir"

              ln -sfn "$dir" "$CURRENT_LINK"

              cd "$CURRENT_LINK/server"
              docker compose up -d --build

              if pm2 describe "$APP_NAME" > /dev/null 2>&1; then
                echo "  PM2: restarting existing process..."
                NODE_ENV=production pm2 restart "$APP_NAME" --update-env
              else
                echo "  PM2: starting new process..."
                NODE_ENV=production pm2 start "$PM2_ENTRY" \
                  --name "$APP_NAME" 
              fi

              pm2 save
            }

            rollback() {
              echo "  DEPLOYMENT FAILED - initiating rollback"

              rm -rf "$RELEASE_DIR" || true

              mapfile -t stable_list < <(get_stable_list)

              if [[ ${#stable_list[@]} -eq 0 ]]; then
                echo "No stable versions found, cannot rollback!"
                exit 1
              fi

              local last_stable="${stable_list[0]}"
              local last_stable_dir="$DEPLOY_DIR/$last_stable"

              if [[ ! -d "$last_stable_dir" ]]; then
                echo "Stable dir missing: $last_stable_dir, cannot rollback!"
                exit 1
              fi

              echo "Rolling back to: $last_stable"
              activate_release "$last_stable_dir"

              if health_check; then
                echo "Rollback succeeded. Running on: $last_stable"
              else
                echo "WARNING: rollback health check also failed!"
              fi
              exit 1
            }

            trap rollback ERR

            echo "[1/9] Preparing release directory: $RELEASE_DIR"
            mkdir -p "$DEPLOY_DIR"

            mapfile -t stable_list < <(get_stable_list)
            if [[ ${#stable_list[@]} -gt 0 ]]; then
              PREV_DIR="$DEPLOY_DIR/${stable_list[0]}"
              if [[ -d "$PREV_DIR/.git" ]]; then
                echo "  Cloning from local copy (fast)..."
                git clone --local "$PREV_DIR" "$RELEASE_DIR"
                cd "$RELEASE_DIR"
                git remote set-url origin "https://github.com/$GH_REPO.git"
                git fetch origin
                git checkout "$GH_SHA"
              fi
            fi

            if [[ ! -d "$RELEASE_DIR/.git" ]]; then
              echo "  Fresh clone from GitHub..."
              git clone "https://github.com/$GH_REPO.git" "$RELEASE_DIR"
              cd "$RELEASE_DIR"
              git checkout "$GH_SHA"
            fi

            echo "[2/9] Linking .env.production..."
            if [[ ! -f "$ENV_FILE" ]]; then
              echo "ERROR: $ENV_FILE not found on EC2!"
              echo "One-time setup: nano $ENV_FILE  &&  chmod 600 $ENV_FILE"
              exit 1
            fi
            ln -sf "$ENV_FILE" "$RELEASE_DIR/server/.env.production"
            echo "  Linked: $RELEASE_DIR/server/.env.production to $ENV_FILE"

            cd "$RELEASE_DIR/server"

            echo "[3/9] Installing dependencies..."
            NODE_OPTIONS="--max-old-space-size=512" \
              pnpm install --child-concurrency=1 --network-concurrency=1

            echo "[4/9] Generating Prisma client..."
            pnpm prisma:generate:prod

            echo "[5/9] Running image script..."
            NODE_OPTIONS="--max-old-space-size=512" \
              pnpm script:images --child-concurrency=1 --network-concurrency=1

            echo "[5/9] Running GeoIP script..."
            NODE_OPTIONS="--max-old-space-size=512" \
              pnpm script:geoip:prod --child-concurrency=1 --network-concurrency=1

            echo "[6/9] Building backend..."
            npm_config_child_concurrency=1 \
            npm_config_network_concurrency=1 \
            NODE_OPTIONS="--max-old-space-size=500" \
              pnpm build

            echo "[7/9] Activating new release..."
            activate_release "$RELEASE_DIR"

            echo "[8/9] Health check..."
            health_check

            echo "[9/9] Running database migrations..."
            pnpm prisma:migrate:prod

            trap - ERR

            mapfile -t stable_list < <(get_stable_list)
            new_list=("$RELEASE_ID" "${stable_list[@]}")

            max=${{ env.MAX_STABLE }}
            kept=("${new_list[@]::$max}")
            evicted=("${new_list[@]:$max}")

            for old_id in "${evicted[@]}"; do
              echo "  Removing old release: $old_id"
              rm -rf "$DEPLOY_DIR/$old_id"
            done

            write_stable_list "${kept[@]}"

            echo ""
            echo "  Deployment successful: $RELEASE_ID"

      - name: Notify failure
        if: failure()
        run: |
          echo "Deployment failed for SHA ${{ github.sha }}."
          echo "Server automatically rolled back to last stable version."